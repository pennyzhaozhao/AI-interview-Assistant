name: Windows release

# Builds the Windows app and attaches two files to a GitHub Release, next to the macOS .dmg:
#   InterviewAssistant-<version>-Windows-x64-Setup.exe  installer (recommended; Start menu, uninstall)
#   InterviewAssistant-<version>-Windows-x64.exe        portable single-file exe
# The in-app updater (UpdateChecker.cs / UpdateInstaller.cs) picks the Setup for installed copies
# and the portable exe for portable copies.
#
# - Publishing a release (tag like v1.2.0) builds and uploads automatically.
# - "Run workflow" lets you build for an existing tag (creates the release if it does not exist).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to upload to (e.g. v1.1.0). The selected branch is what gets built."
        required: true
      upload:
        description: "Upload to the release (off = build only; files are kept as a workflow artifact)."
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PROJECT: Windows platform/src/InterviewAssistant.App/InterviewAssistant.App.csproj
      GH_TOKEN: ${{ github.token }}
    steps:
      # Release event: build the tagged commit. Manual run: build the branch you ran it on
      # (normally main) and upload under the given tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Resolve version from tag
        id: version
        shell: pwsh
        run: |
          $version = $env:TAG.TrimStart('v', 'V')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag '$env:TAG' must look like v1.2.3" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish single-file exe
        shell: pwsh
        run: |
          dotnet publish "$env:PROJECT" `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:GenerateDocumentationFile=false `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:AssemblyVersion=${{ steps.version.outputs.version }}.${{ github.run_number }} `
            -p:FileVersion=${{ steps.version.outputs.version }}.${{ github.run_number }} `
            -o publish
          $asset = "InterviewAssistant-${{ steps.version.outputs.version }}-Windows-x64.exe"
          Copy-Item publish/InterviewAssistant.exe $asset
          Get-Item $asset | Format-List Name, Length
          "ASSET=$asset" >> $env:GITHUB_ENV

      - name: Build installer
        shell: pwsh
        run: |
          # windows-latest ships Inno Setup 6; install it only if missing.
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
            if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          }
          $exe = (Resolve-Path publish/InterviewAssistant.exe).Path
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" "/DSourceExe=$exe" "/O$PWD" "Windows platform/installer/InterviewAssistant.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          $setup = "InterviewAssistant-${{ steps.version.outputs.version }}-Windows-x64-Setup.exe"
          Get-Item $setup | Format-List Name, Length
          "SETUP=$setup" >> $env:GITHUB_ENV

      - name: Upload to release
        if: github.event_name == 'release' || inputs.upload
        shell: pwsh
        run: |
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            # Created by "Run workflow": start as a draft so the in-app update checks (which read the
            # latest published release) only see it once the macOS .dmg is attached and it is published.
            $notes = "${{ github.workspace }}/.github/release-notes/$env:TAG.md"
            if (Test-Path $notes) {
              gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "InterviewAssistant ${{ steps.version.outputs.version }}" --notes-file $notes
            } else {
              gh release create $env:TAG --repo $env:GITHUB_REPOSITORY --draft --target $env:GITHUB_SHA --title "InterviewAssistant ${{ steps.version.outputs.version }}" --notes "Windows build."
            }
          }
          # Publishing a draft made by "Run workflow" fires this workflow again. The files are already
          # attached then: keep them. Re-uploading with --clobber deletes them first, and downloads
          # (browser or in-app update) fail until the new upload finishes.
          if ("${{ github.event_name }}" -eq "release") {
            $existing = gh release view $env:TAG --repo $env:GITHUB_REPOSITORY --json assets -q ".assets[].name"
            if (($existing -contains $env:SETUP) -and ($existing -contains $env:ASSET)) {
              Write-Host "Windows files are already attached to $env:TAG; leaving them unchanged."
              exit 0
            }
          }
          gh release upload $env:TAG $env:SETUP $env:ASSET --repo $env:GITHUB_REPOSITORY --clobber

      - uses: actions/upload-artifact@v4
        with:
          name: InterviewAssistant-Windows-${{ steps.version.outputs.version }}
          path: |
            ${{ env.SETUP }}
            ${{ env.ASSET }}
